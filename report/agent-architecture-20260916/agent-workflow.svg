      <path d="M0 0 H57 L80 23 V100 H0 Z" fill="#f2fbff"/>
      <path d="M57 0 V23 H80" fill="#bce6f7"/>
      <path d="M14 43 H64 M14 58 H64 M14 73 H48" fill="none"/>
    </g>
    <g id="books" stroke="#195f50" stroke-width="2.7">
      <rect x="0" y="13" width="20" height="60" rx="2" fill="#a8d8ca"/>
      <rect x="23" y="3" width="22" height="70" rx="2" fill="#dcf1e9"/>
      <path d="M52 12 L69 7 L85 67 L67 73 Z" fill="#73b99f"/>
