      .wire { fill: none; stroke: #44494c; stroke-width: 3; marker-end: url(#arrow-small); }
      .knowledge { fill: none; stroke: #19735d; stroke-width: 4; marker-end: url(#arrow-green); }
      .repair { fill: none; stroke: #b9542c; stroke-width: 4; stroke-dasharray: 10 7; marker-end: url(#arrow-orange); }
      .optional { fill: #fafbfc; stroke: #7b848a; stroke-width: 2; stroke-dasharray: 7 5; }
      .tool { fill: #f0f8fc; stroke: #81a9bc; stroke-width: 2; }
    </style>
