    <g id="robot" stroke="#102b3b" stroke-width="2.7" stroke-linejoin="round">
      <ellipse cx="64" cy="142" rx="49" ry="4" fill="#e6ebee" stroke="none"/>
      <path d="M49 117 L45 134 L31 136 L31 142 L55 142 L62 119" fill="#168cd0"/>
      <path d="M70 118 L75 135 L88 137 L88 142 L65 142 L61 119" fill="#168cd0"/>
      <path d="M34 96 L18 106 L9 123 L18 128 L32 110 L44 108" fill="#36b8f0"/>
      <path d="M88 96 L101 106 L116 111 L112 122 L95 117 L81 108" fill="#36b8f0"/>
      <circle cx="25" cy="107" r="5" fill="#d9e9ef"/>
      <circle cx="99" cy="108" r="5" fill="#d9e9ef"/>
      <path d="M44 88 L84 88 L91 112 L78 126 L48 125 L35 110 Z" fill="#149ada"/>
      <path d="M48 97 H79 L76 113 H51 Z" fill="#d8f6ff"/>
      <path d="M56 105 H70" fill="none"/>
      <path d="M59 77 V89 H71 V77" fill="#7da5b7"/>
      <path d="M27 23 L19 12" fill="none"/>
      <circle cx="17" cy="9" r="4" fill="#73e4ff"/>
      <path d="M101 22 L108 12" fill="none"/>
      <circle cx="110" cy="9" r="4" fill="#73e4ff"/>
      <rect x="13" y="39" width="12" height="26" rx="5" fill="#607c90"/>
      <rect x="102" y="39" width="12" height="26" rx="5" fill="#607c90"/>
      <path d="M24 32 Q26 16 49 15 L83 15 Q105 18 105 35 L102 68 Q99 84 81 87
               L47 85 Q25 82 23 66 Z" fill="#20a9eb"/>
      <path d="M43 17 L48 33 L82 33 L88 18" fill="#1286cc"/>
      <path d="M29 41 Q40 35 48 38 M83 38 Q92 35 98 41" fill="none" stroke="#90eaff"/>
      <ellipse cx="44" cy="55" rx="10" ry="13" fill="#80f0ff"/>
      <ellipse cx="84" cy="55" rx="10" ry="13" fill="#80f0ff"/>
      <ellipse cx="42" cy="51" rx="3" ry="5" fill="white" stroke="none"/>
      <ellipse cx="82" cy="51" rx="3" ry="5" fill="white" stroke="none"/>
      <path d="M58 73 Q64 76 70 72" fill="none" stroke-width="2"/>
    </g>
    <g id="clipboard" stroke="#244c60" stroke-width="2.4" stroke-linejoin="round">
