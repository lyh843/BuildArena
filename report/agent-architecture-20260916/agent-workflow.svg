<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="2400" height="1590" viewBox="0 0 2400 1590"
     role="img" aria-labelledby="title description">
  <title id="title">BuildArena: Current Skill-Augmented Agent Workflow</title>
  <desc id="description">
    Architecture verified against the local repository on September 16, 2026.
    Optional read-only skill retrieval augments only the Planner. Each planned
    substructure passes through Drafter and Reviewer, a versioned recipe and real
    geometry preflight, then Guidance and Builder with sequential batches of one
    to five operations. Failed batches can return to drafting for at most two
    local repairs. WorkingContext combines canonical facts, recent dialogue and
    threshold-triggered LLM summaries only for structured drafting and building.
    Refine for spinful structures and Assemble for multiple substructures reuse
    Builder and Guidance in the legacy dialogue path. Completion and evidence
    guards, the scheduler, SQLite and request logs support the workflow.
    Physics evaluation is a separate run: Transport uses Controller, simulation
    export, a Windows bridge, Besiege with Lua and trajectory feedback, up to
    three trials. Support and Lift skip Controller. Skill code is not executed.
  </desc>
  <defs>
